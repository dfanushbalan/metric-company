services:
  - type: web
    name: appointment-slot-booker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_FALLBACK_SQLITE
        value: "True"
      - key: DEBUG
        value: "False"
